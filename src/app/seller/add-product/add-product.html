<div class="page-container">

  <header class="topbar">
    <h2>BidZone Seller Panel</h2>
    <a routerLink="/seller">Seller Dashboard</a>
  </header>

  <div class="page-heading">
    <div>
      <h1>Add New Product</h1>
      <p>Create your product listing and schedule an auction.</p>
    </div>

    <a routerLink="/seller" class="back-btn">← Back to Dashboard</a>
  </div>

  <div class="form-card">

    <div class="form-title">
      <h2>Product Information</h2>
      <p>Enter the details of the product you want to sell.</p>
    </div>

    <form #productForm="ngForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Product Name *</label>
        <input
          type="text"
          name="name"
          [(ngModel)]="product.name"
          placeholder="Enter product name"
          required
          minlength="3">
      </div>

      <div class="form-group">
        <label>Description *</label>
        <textarea
          name="description"
          [(ngModel)]="product.description"
          placeholder="Describe your product"
          rows="4"
          required>
        </textarea>
      </div>

      <div class="form-group">
        <label>Category *</label>
        <select
          name="category"
          [(ngModel)]="product.category"
          required>
          <option value="" disabled>Select category</option>
          <option value="Electronics">Electronics</option>
          <option value="Fashion">Fashion</option>
          <option value="Furniture">Furniture</option>
          <option value="Vehicles">Vehicles</option>
          <option value="Collectibles">Collectibles</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-row">

        <div class="form-group">
          <label>Starting Price (₹) *</label>
          <input
            type="number"
            name="startingPrice"
            [(ngModel)]="product.startingPrice"
            min="1"
            required>
        </div>

        <div class="form-group">
          <label>Minimum Bid Increment (₹) *</label>
          <input
            type="number"
            name="minIncrement"
            [(ngModel)]="product.minIncrement"
            min="1"
            required>
        </div>

      </div>

      <div class="form-group">
        <label>Product Image URL *</label>
        <input
          type="url"
          name="imageUrl"
          [(ngModel)]="product.imageUrl"
          placeholder="https://example.com/product.jpg"
          required>
      </div>

      <div class="image-preview" *ngIf="product.imageUrl">
        <p>Image Preview</p>
        <img [src]="product.imageUrl" alt="Product preview">
      </div>

      <h3 class="section-heading">Auction Schedule</h3>

      <div class="form-row">

        <div class="form-group">
          <label>Auction Start Date & Time *</label>
          <input
            type="datetime-local"
            name="startDate"
            [(ngModel)]="product.startDate"
            required>
        </div>

        <div class="form-group">
          <label>Auction End Date & Time *</label>
          <input
            type="datetime-local"
            name="endDate"
            [(ngModel)]="product.endDate"
            required>
        </div>

      </div>

      <div class="success-message" *ngIf="message">
        {{ message }}
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="form-actions">
        <a routerLink="/seller" class="cancel-btn">Cancel</a>

        <button
          type="submit"
          [disabled]="productForm.invalid">
          Add Product
        </button>
      </div>

    </form>
  </div>
</div>
